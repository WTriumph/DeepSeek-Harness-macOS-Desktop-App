name: Bug Report
description: 报告一个 bug（请使用中文或英文）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认没有重复的 issue。
  - type: input
    id: version
    attributes:
      label: 版本
      description: App 菜单「关于 DeepSeek Harness」里的版本号
      placeholder: 0.1.0-rc.5 (Desktop 2)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 15.5 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 「数据与维护…」→「打开日志」里的 desktop.log 内容
