name: Bug Report
description: 报告一个 bug（请使用中文或英文）
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认没有重复的 issue。
        请勿提交 API 密钥、凭据、未脱敏日志或工作区文件。
        Thanks for reporting. Never post API keys, credentials, unredacted logs, or workspace files.
  - type: input
    id: version
    attributes:
      label: 版本
      description: App 菜单「关于 DeepSeek Harness」里的版本号
      placeholder: 0.1.0-rc.5 (Desktop 3)
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本与芯片
      placeholder: 例如 macOS 15.5 / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 如何触发这个问题？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志 / Redacted logs（可选）
      description: 启动失败页可打开日志目录。仅粘贴与问题相关且已移除 API 密钥、凭据、用户名和工作区路径的片段；安全问题请改用 SECURITY.md 中的私密渠道。
