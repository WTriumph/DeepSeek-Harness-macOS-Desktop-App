name: Feature Request
description: 提出新功能或改进建议（请使用中文或英文）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 现在有什么不方便/做不了？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的解决方案
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）
